spring.application.name=auth-svc

# SOT: 배포·운영 값의 기준은 infra 폴더다. 이 파일은 Spring 바인딩 키만 정의한다.
server.port=${SERVER_PORT}

# JWT 서명·TTL·HttpOnly 쿠키(로그인 응답 헤더). env: JWT_*, JWT_COOKIE_*.
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
jwt.cookie.name=${JWT_COOKIE_NAME:access_token}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.cookie.same-site=${JWT_COOKIE_SAMESITE:Lax}
jwt.cookie.path=${JWT_COOKIE_PATH:/}
jwt.cookie.domain=${JWT_COOKIE_DOMAIN:oinkvalley.com}

# 게스트 로그인. 꺼져 있으면 POST /auth/guest 는 조용히 204. env: GUEST_*.
guest.enabled=${GUEST_LOGIN_ENABLED:false}
guest.email-domain=${GUEST_EMAIL_DOMAIN:guest.oinkvalley.com}

# k3s·로컬 실행: SPRING_DATASOURCE_* 필수 (기본값 없음).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.schema=${SPRING_DATASOURCE_HIKARI_SCHEMA}
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.open-in-view=false

# profile gRPC (ClusterIP). env: SERVICE_PROFILE_GRPC_TARGET
spring.grpc.client.channel.profile.target=${SERVICE_PROFILE_GRPC_TARGET}
