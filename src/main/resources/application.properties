spring.application.name=auth-svc

# SOT: 배포·운영 값 = infra. 이 파일은 Spring 바인딩 키만 (env 기본값 없음).
server.port=${SERVER_PORT}

# JWT 서명·TTL·HttpOnly 쿠키. env: JWT_*, JWT_COOKIE_*
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}
jwt.cookie.name=${JWT_COOKIE_NAME}
jwt.cookie.secure=${JWT_COOKIE_SECURE}
jwt.cookie.same-site=${JWT_COOKIE_SAMESITE}
jwt.cookie.path=${JWT_COOKIE_PATH}
jwt.cookie.domain=${JWT_COOKIE_DOMAIN}

# 게스트 로그인. env: GUEST_*
guest.enabled=${GUEST_LOGIN_ENABLED}
guest.email-domain=${GUEST_EMAIL_DOMAIN}

# k3s·로컬: SPRING_DATASOURCE_* 필수.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.schema=${SPRING_DATASOURCE_HIKARI_SCHEMA}
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.open-in-view=false

# profile gRPC. env: SERVICE_PROFILE_GRPC_TARGET
spring.grpc.client.channel.profile.target=${SERVICE_PROFILE_GRPC_TARGET}

# k3s: NATS_URL. 비우면 발행만 끔. Subject·수신 정책은 여기 없음.
nats.url=${NATS_URL}
